<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pre-Op Assessment Trainer</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap');

:root{
  --bg:#F6F4EE;
  --surface:#FFFFFF;
  --surface-2:#EFEBE0;
  --ink:#1C2B33;
  --ink-soft:#5B6B72;
  --line:#DCD5C3;
  --teal:#2D6B66;
  --teal-deep:#1B3E3B;
  --teal-pale:#E4EEEC;
  --amber:#C77C34;
  --amber-pale:#F7E9D8;
  --rose:#AE4B44;
  --rose-pale:#F5E2E0;
  --green:#4C7A52;
  --green-pale:#E4EDE1;
  --radius:10px;
  --shadow: 0 1px 2px rgba(28,43,51,0.06), 0 6px 20px rgba(28,43,51,0.06);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:'Inter',sans-serif;
  -webkit-font-smoothing:antialiased;
}
#app{max-width:1000px;margin:0 auto;padding:20px 16px 60px;}

h1,h2,h3{font-family:'Source Serif 4',serif;margin:0;}
.eyebrow{
  font-family:'JetBrains Mono',monospace;
  font-size:11px;
  letter-spacing:0.14em;
  text-transform:uppercase;
  color:var(--teal);
  font-weight:700;
}
.muted{color:var(--ink-soft);}
button{font-family:'Inter',sans-serif;cursor:pointer;}
button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, [tabindex]:focus-visible{outline:2px solid var(--teal); outline-offset:2px;}
/* iOS Safari zooms the page when a focused field's text is under 16px */
input, select, textarea{font-size:16px;}
.sr-only{position:absolute !important; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0;}
h1:focus, h2:focus{outline:none;}

/* ---------- HEADER ---------- */
.masthead{
  display:flex; justify-content:space-between; align-items:flex-end;
  border-bottom:2px solid var(--ink); padding-bottom:14px; margin-bottom:28px;
}
.masthead h1{font-size:26px; font-weight:700; color:var(--ink);}
.masthead .tag{font-size:13px; color:var(--ink-soft); margin-top:4px;}
.masthead .brand-mark{
  font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--ink-soft);
  text-align:right; line-height:1.5;
}

/* ---------- SELECT SCREEN ---------- */
.intro{margin-bottom:26px; max-width:640px;}
.intro p{color:var(--ink-soft); line-height:1.6; font-size:15px;}

.primer-callout{
  background:var(--teal-pale); border:1px solid #C3DAD6; border-radius:var(--radius);
  padding:16px 20px; display:flex; justify-content:space-between; align-items:center; gap:16px;
  margin-bottom:22px;
}
@media (max-width:560px){.primer-callout{flex-direction:column; align-items:flex-start;} .primer-callout .begin-btn{width:100%;}}

.setup-card{
  background:var(--surface); border:1px solid var(--line); border-left:5px solid var(--amber);
  border-radius:var(--radius); padding:18px 20px; margin-bottom:22px; box-shadow:var(--shadow);
}
.setup-card.ready{border-left-color:var(--green);}
.setup-card h3{font-size:16px; margin-bottom:4px;}
.setup-card .setup-hint{font-size:13px; color:var(--ink-soft); line-height:1.55; margin-bottom:12px;}
.setup-card .setup-row{display:flex; gap:8px; flex-wrap:wrap; align-items:center;}
.setup-card input[type=password]{
  flex:1; min-width:220px; border:1px solid var(--line); border-radius:8px; padding:10px 12px;
  font-size:16px; font-family:'Inter',sans-serif;
}
.setup-card .save-key-btn{
  background:var(--teal); color:#fff; border:none; border-radius:8px; padding:10px 16px; font-size:13.5px; font-weight:600; white-space:nowrap;
}

.chart-rack{display:flex; flex-direction:column; gap:14px;}
.chart-card{
  background:var(--surface);
  border:1px solid var(--line);
  border-left:5px solid var(--teal);
  border-radius:var(--radius);
  padding:18px 20px;
  box-shadow:var(--shadow);
  display:flex; justify-content:space-between; align-items:center; gap:16px;
  transition:transform .15s ease, box-shadow .15s ease;
}
@media (hover:hover){.chart-card:hover{transform:translateY(-2px); box-shadow:0 10px 26px rgba(28,43,51,0.1);}}
.chart-card .tab{
  font-family:'JetBrains Mono',monospace; font-size:10px; letter-spacing:.1em;
  color:var(--teal); text-transform:uppercase; margin-bottom:6px; font-weight:700;
}
.chart-card h3{font-size:19px;}
.chart-card .meta{color:var(--ink-soft); font-size:13.5px; margin-top:4px;}
.chart-card .proc{color:var(--ink); font-size:14px; margin-top:8px; font-weight:500;}
.begin-btn{
  background:var(--teal); color:#fff; border:none; border-radius:8px;
  padding:10px 18px; font-size:14px; font-weight:600; white-space:nowrap;
}
.begin-btn:hover{background:var(--teal-deep);}

@media (max-width:560px){
  .chart-card{flex-direction:column; align-items:flex-start;}
  .begin-btn{width:100%;}
}

/* ---------- INTERVIEW SCREEN ---------- */
.monitor{
  background:var(--teal-deep); color:#EAF3F1; border-radius:var(--radius);
  padding:14px 18px; display:flex; flex-wrap:wrap; gap:18px; align-items:center;
  justify-content:space-between; margin-bottom:16px;
}
.monitor .who h2{color:#fff; font-size:19px;}
.monitor .who .sub{font-size:12.5px; color:#9FC4BE; font-family:'JetBrains Mono',monospace; margin-top:3px;}
.monitor .exit-btn{
  background:var(--amber); border:none; color:#241505; font-weight:700;
  padding:11px 14px; border-radius:8px; font-size:13px; min-height:44px;
}
.monitor .leave-btn{background:none; border:1px solid #4F7570; color:#EAF3F1; border-radius:8px; padding:10px 12px; font-size:12.5px; font-weight:600; min-height:44px;}

.interview-grid{display:grid; grid-template-columns:1.5fr 1fr; gap:16px;}
@media (max-width:760px){.interview-grid{grid-template-columns:1fr;}}

.panel{
  background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
  box-shadow:var(--shadow); overflow:hidden;
}
.panel-head{
  padding:12px 16px; border-bottom:1px solid var(--line); background:var(--surface-2);
  display:flex; justify-content:space-between; align-items:center;
}
.panel-head h3{font-size:14px; font-family:'JetBrains Mono',monospace; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-soft);}

.transcript{
  height:380px; height:clamp(240px, 52vh, 480px); height:clamp(240px, 52dvh, 480px);
  overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:10px;
}
.bubble{max-width:82%; padding:10px 13px; border-radius:12px; font-size:14.5px; line-height:1.5;}
.bubble.student{align-self:flex-end; background:var(--teal-pale); color:var(--teal-deep); border-bottom-right-radius:3px;}
.bubble.patient{align-self:flex-start; background:var(--surface-2); color:var(--ink); border-bottom-left-radius:3px;}
.bubble .role-tag{display:block; font-family:'JetBrains Mono',monospace; font-size:10px; text-transform:uppercase; letter-spacing:.08em; opacity:.8; margin-bottom:3px;}
.bubble.thinking{font-style:italic; color:var(--ink-soft);}

.input-row{display:flex; gap:8px; padding:12px 14px; border-top:1px solid var(--line); background:var(--surface-2);}
.input-row input[type=text]{
  flex:1; min-width:0; border:1px solid var(--line); border-radius:8px; padding:10px 12px; font-size:16px; font-family:'Inter',sans-serif;
}
.icon-btn{
  border:1px solid var(--line); background:#fff; border-radius:8px; width:44px; height:44px;
  display:flex; align-items:center; justify-content:center; flex-shrink:0; font-size:17px;
}
.icon-btn.active{background:var(--rose); border-color:var(--rose); color:#fff;}
.send-btn{
  background:var(--teal); color:#fff; border:none; border-radius:8px; padding:0 16px; font-weight:600; font-size:14px; min-height:44px;
}
.send-btn:disabled{opacity:.5; cursor:default;}

.exam-list{padding:10px; display:flex; flex-direction:column; gap:8px; max-height:560px; overflow-y:auto;}
@media (max-width:760px){.exam-list{max-height:none; overflow:visible;}}
.exam-group-title{font-family:'JetBrains Mono',monospace; font-size:10.5px; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-soft); font-weight:700; margin:6px 2px 0;}
.exam-item{
  border:1px solid var(--line); border-radius:8px; background:#fff; overflow:hidden; flex-shrink:0;
}
.exam-item button.exam-toggle{
  width:100%; text-align:left; background:none; border:none; padding:12px 13px; min-height:44px;
  display:flex; justify-content:space-between; align-items:center; font-size:13.5px; font-weight:600; color:var(--ink);
}
.exam-item.done button.exam-toggle{color:var(--green);}
.exam-item .checkmark{font-family:'JetBrains Mono',monospace; font-size:13px;}
.exam-item .finding{
  padding:0 13px 12px; font-size:13.5px; color:var(--ink-soft); line-height:1.5; display:none;
}
.exam-item.open .finding{display:block;}

.voice-note{font-size:12px; color:var(--ink-soft); padding:8px 14px 0;}

.step-badge{
  font-family:'JetBrains Mono',monospace; font-size:11px; letter-spacing:.06em; text-transform:uppercase;
  background:var(--amber); color:#241505; padding:6px 11px; border-radius:20px; font-weight:700; white-space:nowrap;
}
.step-badge.done{background:var(--green); color:#fff;}
.exit-btn:disabled{opacity:.45; cursor:not-allowed;}

.intro-banner{
  background:var(--amber-pale); border:1px solid #E4C79B; color:#6B4114;
  padding:11px 15px; border-radius:var(--radius); font-size:13.5px; line-height:1.5; margin-bottom:14px;
}

.locked-panel .exam-list{opacity:.35; pointer-events:none;}
.lock-note{
  padding:10px 16px; font-size:12.5px; color:var(--ink-soft);
  border-bottom:1px solid var(--line); background:var(--surface-2);
}

.voice-settings{
  padding:14px 16px; border-bottom:1px solid var(--line); background:var(--surface-2);
  display:flex; flex-direction:column; gap:10px;
}
.vs-row{display:flex; flex-direction:column; gap:5px;}
.vs-row label{font-size:12px; font-weight:600; color:var(--ink-soft);}
.vs-row input[type=password], .vs-row select{
  border:1px solid var(--line); border-radius:7px; padding:8px 10px; font-size:16px; font-family:'Inter',sans-serif; background:#fff;
}
.vs-hint{font-size:12px; color:var(--ink-soft); line-height:1.5;}
.vs-actions{display:flex; gap:8px;}
.vs-actions button{
  border:1px solid var(--line); background:#fff; border-radius:7px; padding:10px 12px; font-size:12.5px; font-weight:600; color:var(--ink); min-height:44px;
}
.vs-actions button.primary{background:var(--teal); color:#fff; border-color:var(--teal);}
.vs-tag{display:inline-block; font-family:'JetBrains Mono',monospace; font-size:10px; padding:2px 7px; border-radius:10px; background:var(--green-pale); color:var(--green); font-weight:700; margin-left:6px;}

/* ---------- REPORT SCREEN ---------- */
.score-hero{
  background:var(--teal-deep); color:#fff; border-radius:var(--radius); padding:26px 24px;
  display:flex; justify-content:space-between; align-items:center; gap:20px; margin-bottom:20px; flex-wrap:wrap;
}
.score-hero .num{font-family:'Source Serif 4',serif; font-size:56px; font-weight:700; line-height:1;}
.score-hero .num span{font-size:22px; color:#9FC4BE;}
.score-hero .label{font-family:'JetBrains Mono',monospace; font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:#9FC4BE; margin-bottom:6px;}
.score-hero .verdict{font-size:15px; max-width:420px; color:#EAF3F1; line-height:1.5;}

.domains{display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:12px; margin-bottom:20px;}
.domain-card{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:14px 16px;}
.domain-card .dname{font-size:12.5px; font-weight:600; color:var(--ink-soft); margin-bottom:8px;}
.domain-card .dscore{font-family:'Source Serif 4',serif; font-size:22px; font-weight:700; margin-bottom:8px;}
.bar-track{height:6px; background:var(--surface-2); border-radius:4px; overflow:hidden;}
.bar-fill{height:100%; background:var(--teal); border-radius:4px;}

.report-section{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:16px 18px; margin-bottom:14px;}
.report-section h4, .report-section .h4{margin-top:0; font-size:13px; font-family:'JetBrains Mono',monospace; text-transform:uppercase; letter-spacing:.07em; margin-bottom:10px;}
.report-section.critical .h4, .report-section.critical h4{color:var(--rose);}
.report-section.strength .h4, .report-section.strength h4{color:var(--green);}
.report-section.teach .h4, .report-section.teach h4{color:var(--teal);}
.report-section ul{margin:0; padding-left:18px; line-height:1.7; font-size:14.5px;}
.report-section.critical{background:var(--rose-pale); border-color:#E3C3BF;}
.report-section.strength{background:var(--green-pale); border-color:#C9DCC5;}
.report-section.teach{background:var(--teal-pale); border-color:#C3DAD6;}

.again-btn{
  background:var(--ink); color:#fff; border:none; border-radius:8px; padding:12px 20px;
  font-weight:600; font-size:14.5px; margin-top:6px;
}

.loading-screen{text-align:center; padding:80px 20px; color:var(--ink-soft);}
.spinner{
  width:34px; height:34px; border:3px solid var(--line); border-top-color:var(--teal);
  border-radius:50%; margin:0 auto 16px; animation:spin 0.8s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg);}}

.error-banner{background:var(--rose-pale); border:1px solid #E3C3BF; color:var(--rose); padding:10px 14px; border-radius:8px; font-size:13.5px; margin-bottom:14px;}

/* ---------- BRIEFING SCREEN ---------- */
.brief-sub{color:var(--ink-soft); font-size:14px; margin-top:4px;}
.brief-intro{
  background:var(--surface); border:1px solid var(--line); border-left:5px solid var(--teal);
  border-radius:var(--radius); padding:18px 20px; margin:18px 0 22px; box-shadow:var(--shadow);
  font-size:15px; line-height:1.65; color:var(--ink);
}
.brief-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); gap:14px; margin-bottom:22px;}
.brief-card{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:16px 18px; box-shadow:var(--shadow);}
.brief-card .bicon{font-size:20px; margin-bottom:6px;}
.brief-card h4, .brief-card .h4{margin:0 0 4px; font-family:'Source Serif 4',serif; font-size:17px; margin-bottom:4px;}
.brief-card .why{font-size:13px; color:var(--ink-soft); line-height:1.5; margin-bottom:10px; font-style:italic;}
.brief-card ul{margin:0; padding-left:18px; font-size:13.5px; line-height:1.65; color:var(--ink);}
.brief-card ul li{margin-bottom:3px;}

.asa-box{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:16px 18px; margin-bottom:22px; box-shadow:var(--shadow);}
.asa-box h4, .asa-box .h4{font-family:'Source Serif 4',serif; font-size:16px; margin-bottom:10px;}
table.asa-table{width:100%; border-collapse:collapse; font-size:13.5px;}
table.asa-table td{padding:7px 6px; border-bottom:1px solid var(--line); vertical-align:top;}
table.asa-table td.cls{font-family:'JetBrains Mono',monospace; font-weight:700; color:var(--teal); white-space:nowrap; width:70px;}

.brief-cta-row{display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:12px; margin-top:6px;}
.back-link{background:none; border:none; color:var(--ink-soft); font-size:13.5px; font-weight:600; text-decoration:underline; padding:10px 0; min-height:44px;}

/* ---------- ASSESSMENT & PLAN SCREEN ---------- */
.ap-form{display:flex; flex-direction:column; gap:16px;}
.ap-form fieldset{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:14px 18px 16px; margin:0; box-shadow:var(--shadow);}
.ap-form legend{font-family:'Source Serif 4',serif; font-weight:700; font-size:16px; padding:0 6px; margin-left:-6px;}
.ap-form .hint{font-size:13px; color:var(--ink-soft); line-height:1.5; margin:2px 0 10px;}
.choice-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); gap:8px;}
.choice-row{display:flex; flex-wrap:wrap; gap:8px;}
.choice{display:flex; gap:10px; align-items:flex-start; border:1px solid var(--line); border-radius:8px; padding:11px 12px; background:#fff; font-size:14px; line-height:1.4; cursor:pointer; min-height:44px;}
.choice input{margin:2px 0 0; width:18px; height:18px; flex-shrink:0; accent-color:var(--teal);}
.choice:has(input:checked){border-color:var(--teal); background:var(--teal-pale);}
.ap-form textarea{width:100%; min-height:130px; border:1px solid var(--line); border-radius:8px; padding:10px 12px; font-family:'Inter',sans-serif; line-height:1.5; resize:vertical;}
.ap-actions{display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:12px;}

/* ---------- REPORT CHECKLISTS ---------- */
.checklist{list-style:none; padding:0 !important; margin:0;}
.checklist li{display:flex; gap:10px; align-items:flex-start; padding:5px 0; border-bottom:1px solid rgba(0,0,0,0.06);}
.checklist li:last-child{border-bottom:none;}
.checklist .mark{font-family:'JetBrains Mono',monospace; font-weight:700; width:20px; flex-shrink:0; text-align:center;}
.checklist .hit .mark{color:var(--green);}
.checklist .miss .mark{color:var(--rose);}
.crit-tag{display:inline-block; font-family:'JetBrains Mono',monospace; font-size:10px; padding:1px 6px; border-radius:8px; background:var(--rose); color:#fff; font-weight:700; margin-left:6px; vertical-align:1px;}
.compare-table{width:100%; border-collapse:collapse; font-size:14px;}
.compare-table th, .compare-table td{text-align:left; padding:8px 6px; border-bottom:1px solid var(--line); vertical-align:top;}
.compare-table th{font-size:12px; color:var(--ink-soft); font-weight:600;}
.report-actions{display:flex; flex-wrap:wrap; gap:10px; margin-top:6px;}
.report-actions .secondary{background:#fff; color:var(--ink); border:1px solid var(--line); border-radius:8px; padding:12px 16px; font-weight:600; font-size:14.5px;}
.report-section.refs ol{margin:0; padding-left:20px; font-size:13px; line-height:1.6; color:var(--ink-soft);}
.report-section.refs li{margin-bottom:4px;}
.note-small{font-size:12.5px; color:var(--ink-soft); line-height:1.5; margin:4px 0 14px;}

.disclaimer{margin-top:34px; padding-top:14px; border-top:1px solid var(--line); font-size:12.5px; color:var(--ink-soft); line-height:1.6;}

@media (prefers-reduced-motion: reduce){
  *{transition:none !important; animation-duration:2s !important;}
}
@media print{
  body{background:#fff;}
  #app{max-width:none; padding:0;}
  .no-print, .again-btn, .report-actions{display:none !important;}
  .score-hero{background:#fff; color:var(--ink); border:2px solid var(--ink);}
  .score-hero .verdict, .score-hero .label, .score-hero .num span{color:var(--ink);}
  .report-section, .domain-card{break-inside:avoid;}
}
</style>
</head>
<body>
<div id="app"></div>
<div id="sr-live" class="sr-only" aria-live="polite" aria-atomic="true"></div>

<script>
/* ============================= CASE DATA =============================
   Each case has:
   - chart: the ground truth the AI patient role-plays from (students never see it)
   - exam: one finding per physical-exam maneuver (see EXAM_GROUPS)
   - keyHistory: checklist items, matched against what the student typed/said.
       `any` is a list of alternatives; an alternative is a regex, or an array of
       regexes that must ALL appear somewhere in the student's questions.
   - answer: the expected Assessment & Plan, used to score the student's own A&P
*/

// Reusable keyword patterns for the history checklist (matched on lower-cased student text)
const P = {
  npo: /\b(eat|ate|eaten|eating|drink|drank|drunk|drinking|food|fast|fasted|fasting|npo|meal|breakfast|dinner|lunch|snack|nothing by mouth|empty stomach)\b/,
  allergy: /allerg|\breactions? to (any )?(med|drug|antibiotic)/,
  prevAnes: /(an(a)?esthe|put (you |him |her )?(to sleep|under)|been (put )?under|(surger(y|ies)|operations?|procedures?) (before|in the past|previously)|previous (surger|operation|procedure)|prior (surger|operation|procedure)|ever had (an? )?(surger|operation|procedure|an(a)?esthe)|other (surger|operation|procedure))/,
  famAnes: /(family|relative|parents?|mother|father|mom|dad|brother|sister|sibling|cousin|aunt|uncle|grand).{0,80}(an(a)?esthe|surger|operation|reaction|problem)|(an(a)?esthe|surger|reaction).{0,80}(family|relative|parents?|mother|father|mom|dad|brother|sister|sibling|cousin|anyone (else )?related)/,
  meds: /(medication|medicine|\bmeds?\b|pills?|prescri|supplement|vitamin|over the counter|\botc\b|what do you take|taking anything|take any|tablets?|injections?|inhaler|insulin|drugs? (do|are) you)/,
  cardiac: /(chest|heart|palpitat|angina|short(ness)? of breath|breathless|winded|exertion|faint|pass(ed)? out|syncope)/,
  pulm: /(breath|lung|asthma|wheez|cough|copd|pneumonia)/,
  smoking: /(smok|cigar|tobacco|vape|vaping|nicotine|pack)/,

/* ============================= SAVED SESSION (this device/browser only) =============================

const SESSION_KEY = 'preop_session_v2';

function loadSession(){
  try{
    const raw = localStorage.getItem(SESSION_KEY);

  try{

      examOpen: state.examOpen, examDone: Array.from(state.examDone), draft: state.draft,
      assessment: state.assessment, report: state.report, startedAt: state.startedAt
    }));
  }catch(e){ /* storage blocked — the session just won't survive a reload */ }
}

// iPhone/iPad: Safari/WebKit never implements SpeechRecognition, even in
// "Chrome" (every iOS browser is required to use WebKit under the hood), so
// the app's own mic button can't work there. iOS still has its own built-in
// dictation on the keyboard itself, so point students to that instead.
function isIOS(){
  const ua = navigator.userAgent || '';
  const iOSDevice = /iPad|iPhone|iPod/.test(ua);
  // iPadOS 13+ reports as "Macintosh" but has touch support, unlike a real Mac
  const iPadOS13Plus = /Macintosh/.test(ua) && navigator.maxTouchPoints > 1;
  return iOSDevice || iPadOS13Plus;
}

async function callClaude(system, messages, maxTokens){
  if(!PROXY_URL || PROXY_URL.indexOf('PASTE_YOUR_WORKER_URL_HERE')!==-1){
    const err = new Error("This app isn't connected to the class AI service yet — the instructor still needs to set PROXY_URL in the file (see preop-proxy-worker.js for setup steps).");
    err.code = 'NO_PROXY';
    throw err;
  }
  if(!state.classPasscode){
    const err = new Error("Enter the class passcode your instructor gave you.");
    err.code = 'NO_KEY';
    throw err;
  }
  let response;
  try{
    response = await fetch(PROXY_URL, {
      method:"POST",
      headers:{
        "Content-Type":"application/json",
        "X-Class-Passcode": state.classPasscode
      },
      body: JSON.stringify({
        max_tokens: maxTokens || 1000,
        system: system,
        messages: messages
      })
    });
  }catch(networkErr){
    const err = new Error("Couldn't reach the class AI service (network blocked, or you're inside Claude's in-chat preview, which can't make outside requests). Open this file directly in a browser tab and try again.");
    err.code='NETWORK';
    throw err;
  }
  if(!response.ok){
    let detail='';
    try{ const body = await response.json(); detail = body && body.error && body.error.message ? body.error.message : ''; }catch(e){}
    if(response.status===401){
      const err = new Error("That class passcode wasn't recognized. Double-check it with your instructor.");
      err.code='UNAUTHORIZED';
      throw err;
    }
    const err = new Error(detail || ("Request failed: HTTP "+response.status));
    err.code='HTTP_'+response.status;
    throw err;
  }
  const data = await response.json();
  const textBlock = data.content.find(c=>c.type==='text');
  return textBlock ? textBlock.text : '';
}

function chartText(c){
  const ch = c.chart;
  const lines = [
    ['CHIEF COMPLAINT', ch.chiefComplaint], ['PAST MEDICAL HISTORY', ch.pmh], ['PAST SURGICAL HISTORY', ch.psh],
    ['ANESTHESIA HISTORY', ch.anesthesiaHistory], ['MEDICATIONS', ch.medications], ['ALLERGIES', ch.allergies],
    ['FAMILY HISTORY', ch.familyHistory], ['SOCIAL HISTORY', ch.socialHistory], ['NPO / LAST ORAL INTAKE', ch.npoStatus],
    ['REVIEW OF SYSTEMS', ch.reviewOfSystems], ['FUNCTIONAL CAPACITY / EXERCISE TOLERANCE', ch.functionalCapacity],
    ['PREGNANCY STATUS', ch.pregnancy], ['CODE STATUS / ADVANCE DIRECTIVES', ch.codeStatus],
    ['BELIEFS AFFECTING CARE', ch.beliefs], ['CONCERNS / QUESTIONS FOR THE TEAM', ch.concerns]
  ];
  return lines.filter(([,v])=>v).map(([k,v])=>`${k}: ${v}`).join('\n');
}

function whoYouAre(c){
  if(c.speaker){
    return `You are role-playing as ${c.speaker.name}, the ${c.speaker.relation} of ${c.name}, a ${c.age}-year-old ${c.sex==='female'?'girl':'boy'} who is about to have the following procedure: ${c.procedure}. You are answering the interview on your child's behalf.`;

}

function patientSystemPrompt(c){
  return `${whoYouAre(c)} A fourth-year medical student is interviewing you as part of a pre-operative history and physical exam. This is a training simulation.

Your complete, ground-truth medical chart (the student cannot see this, only you know it) is below. Stay completely consistent with it for the entire conversation. Items marked HIDDEN DETAIL are only revealed when the student asks the kind of question described.

${chartText(c)}

RULES FOR HOW YOU RESPOND:
- Speak in first person, in plain lay language (not medical jargon back at them).
- Answer ONLY what is asked. Do not volunteer your entire history unprompted. If asked a broad open-ended question like "tell me about your medical history," give a reasonably brief, natural summary, not an exhaustive recitation.
- If asked about something not in your chart, say you don't have that problem / it's never come up, consistent with the chart.
- Show a believable, mild human personality and appropriate emotion (e.g., some anxiety about surgery, mild annoyance if asked the same thing repeatedly, warmth if the student is reassuring) but do not overact.
- Keep responses fairly short and conversational — 1 to 4 sentences typically, like a real person talking, not a chart dump.
- Reply with spoken words only — no stage directions, asterisks, or descriptions of actions (your reply may be read aloud).
- Never break character, never mention that you are an AI, never mention "the chart" or "the case."
- If the student asks something ambiguous or unclear, respond the way a real person would (asking for clarification, or giving a slightly imprecise answer) rather than being a perfect medical informant.${c.persona ? '\n- '+c.persona : ''}`;
}

/* ============================= AUTOMATED SCORING =============================
   Scores are computed here (not by the AI) so every student is graded the same
   way for the same performance. The AI only writes the narrative feedback. */
function studentText(){
  return state.messages.filter(m=>m.role==='user').map(m=>m.text.toLowerCase()).join('\n');
}
function itemHit(item, text){
  return item.any.some(alt => Array.isArray(alt) ? alt.every(r=>r.test(text)) : alt.test(text));
}
function keyExamFor(c){ return BASE_KEY_EXAM.concat(c.keyExamExtra||[]); }
function examLabel(key){
  for(const g of EXAM_GROUPS){ for(const [k,label] of g.items){ if(k===key) return label; } }
  return key;
}
function optionLabel(list, key){ const f = list.find(([k])=>k===key); return f ? f[1] : key; }
const ASA_NAMES = {1:'ASA I',2:'ASA II',3:'ASA III',4:'ASA IV',5:'ASA V'};

function evaluateEncounter(c){
  const text = studentText();
  const history = c.keyHistory.map(item=>({label:item.label, critical:!!item.critical, hit:itemHit(item, text)}));
  const histHits = history.filter(h=>h.hit).length;

  const keyExam = keyExamFor(c);
  const exam = keyExam.map(k=>({key:k, label:examLabel(k), hit:state.examDone.has(k)}));
  const examHits = exam.filter(e=>e.hit).length;

  const a = state.assessment;
  const asaNum = Number(a.asa);
  const asaOk = c.answer.asa.includes(asaNum);
  const chosen = a.risks || [];
  const riskHits = c.answer.risks.filter(r=>chosen.includes(r));
  const riskMissed = c.answer.risks.filter(r=>!chosen.includes(r));
  const riskExtra = chosen.filter(r=>!c.answer.risks.includes(r) && !(c.answer.okRisks||[]).includes(r));
  const airwayOk = c.answer.airway.includes(a.airway);
  const dispOk = c.answer.disposition.includes(a.disposition);
  const riskScore = Math.max(0, Math.round(9*riskHits.length/c.answer.risks.length) - riskExtra.length);

  const comm = [
    {label:'Introduced yourself by name and stated your role', hit:state.introduced},
    {label:'Used open-ended questions (e.g., "Tell me about…")', hit:P.openEnded.test(text)},
    {label:'Invited the patient\'s questions or concerns', hit:P.concerns.test(text)}
  ];

  const domains = {
    history:{score:Math.round(40*histHits/history.length), max:40,
      auto:`Covered ${histHits} of ${history.length} key history items.`},
    physicalExam:{score:Math.round(20*examHits/exam.length), max:20,
      auto:`Performed ${examHits} of ${exam.length} key exam maneuvers.`},
    clinicalReasoning:{score:(asaOk?6:0)+riskScore+(airwayOk?4:0)+(dispOk?6:0), max:25,
      auto:`ASA ${asaOk?'matches':'differs from'} the expected class; identified ${riskHits.length} of ${c.answer.risks.length} key risks${riskExtra.length?` (plus ${riskExtra.length} not supported by this case)`:''}; airway impression ${airwayOk?'appropriate':'not the expected one'}; disposition ${dispOk?'appropriate':'not the expected one'}.`},
    communication:{score:comm.filter(x=>x.hit).length*5, max:15,
      auto:`${comm.filter(x=>x.hit).length} of 3 communication behaviors observed.`}
  };
  const overall = Object.values(domains).reduce((s,d)=>s+d.score,0);
  return {overall, domains, history, exam, comm,
    plan:{asaChosen:asaNum, emergency:!!a.emergency, asaOk, riskHits, riskMissed, riskExtra, airwayChosen:a.airway, airwayOk, dispChosen:a.disposition, dispOk, planText:a.plan||''}};
}

function gradingSystemPrompt(c, ev){
  const a = state.assessment;
  return `You are an attending anesthesiologist giving written feedback on a fourth-year medical student's pre-operative history and physical in a simulated encounter. Be a fair but rigorous, encouraging teacher — this is formative feedback, not a real clinical record. The numeric scores have already been calculated automatically; do NOT produce scores.

GROUND TRUTH CASE (the student did not see this):
Patient: ${c.name}, ${ageSex(c)}, procedure: ${c.procedure}${c.speaker ? `\n(The student interviewed the ${c.speaker.relation}, ${c.speaker.name}.)` : ''}
${chartText(c)}
Exam findings available: ${JSON.stringify(c.exam)}
Expected ASA classification: ${c.asaClass}
The critical teaching point / red flag for this case: ${c.redFlag}
Expected assessment & plan: ${c.answer.why}

AUTOMATED CHECKLIST (keyword-based, so it can miss unusual phrasing — if the transcript shows the student DID cover an item marked missed, say so):
${ev.history.map(h=>`- [${h.hit?'covered':'missed'}] ${h.label}`).join('\n')}

EXAM MANEUVERS THE STUDENT PERFORMED: ${state.examDone.size ? Array.from(state.examDone).map(examLabel).join(', ') : 'none'}

STUDENT'S ASSESSMENT & PLAN:
ASA: ${ASA_NAMES[Number(a.asa)]||'not given'}${a.emergency?'E':''}
Risks identified: ${(a.risks||[]).map(r=>optionLabel(RISK_OPTIONS,r)).join('; ') || 'none'}
Airway impression: ${optionLabel(AIRWAY_OPTIONS, a.airway) || 'not given'}
Disposition: ${optionLabel(DISPOSITION_OPTIONS, a.disposition) || 'not given'}
Plan and reasoning (free text): ${a.plan ? a.plan : '(none written)'}

Respond with ONLY valid JSON, no markdown fences, no preamble, matching exactly this shape:
{
  "history": "<1-2 sentence feedback on their history taking>",
  "physicalExam": "<1-2 sentence feedback on their exam>",
  "clinicalReasoning": "<1-2 sentence feedback on whether they identified the red flag, risks and a reasonable ASA class>",
  "communication": "<1-2 sentence feedback on rapport, clarity, their introduction, and follow-up questions>",
  "planFeedback": "<2-3 sentences on their written plan — what was sound, what was missing or unsafe>",
  "missedCritical": ["<specific important item they failed to ask or check, be concrete>", "..."],
  "strengths": ["<specific thing they did well, referencing something they actually asked or wrote>", "..."]
}
Base missedCritical and strengths on the ACTUAL transcript provided in the next message, citing specifics. Keep each array to at most 4 concise items.`;
}

const app = document.getElementById('app');

function announce(msg){
  // Screen readers read this region aloud when its text changes
  if(!srLive) return;
  srLive.textContent = '';
  setTimeout(()=>{ srLive.textContent = msg; }, 50);
}

function render(){
  const active = document.activeElement;
  const inputHadFocus = !!(active && active.id==='textInput');
  const examListEl = app.querySelector('.exam-list');
  const examScroll = examListEl ? examListEl.scrollTop : 0;
  const screenChanged = state.screen !== lastRenderedScreen;
  const firstRender = lastRenderedScreen === null;
  lastRenderedScreen = state.screen;

  if(state.screen==='learn') renderLearn();
  else if(state.screen==='interview') renderInterview();
  else if(state.screen==='assess') renderAssess();
  else if(state.screen==='grading') renderGrading();
  else if(state.screen==='report') renderReport();
  else renderSelect();

  persistSession();

  const newExamList = app.querySelector('.exam-list');
  if(newExamList && !screenChanged) newExamList.scrollTop = examScroll;

  if(screenChanged && !firstRender){
    window.scrollTo(0,0);
    if(state.screen==='interview' && !isTouchDevice()){
      focusTextInput();
    }else{
      // Move focus to the new screen's heading so screen-reader users hear where they are
      const h = app.querySelector('[data-screen-heading]');
      if(h) h.focus({preventScroll:true});
    }
  }else if(inputHadFocus){
    // Keep typing focus without popping the keyboard open on every re-render
    focusTextInput();
  }
}

function focusTextInput(){
  const el = document.getElementById('textInput');
  if(!el) return;
  el.focus({preventScroll:true});
  const n = el.value.length;
  try{ el.setSelectionRange(n,n); }catch(e){}
}

function escapeHtml(s){

}
function escapeAttr(s){
  return String(s==null?'':s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function submitTextInput(){

  inputEl.value='';
  state.draft='';

}

function micErrorMessage(err){
  const name = err && err.name;
  if(name==='NotAllowedError' || name==='PermissionDeniedError') return "Microphone access was denied. Click the camera/lock icon in your address bar, allow the microphone for this page, then try again.";
  if(name==='NotFoundError' || name==='DevicesNotFoundError') return "No microphone was found. Check that one is connected and enabled in your system's sound settings.";
  if(name==='NotReadableError') return "Your microphone is already in use by another app, or there's a hardware issue — close other apps using it and try again.";
  if(name==='SecurityError') return "Blocked for security reasons — this page needs to be served over https or localhost, not opened as a local file.";
  return "Couldn't access the microphone (" + (name || (err&&err.message) || 'unknown error') + ").";
}

async function checkMicAccess(){
  if(!recognition){
    return {ok:false, msg:"This browser doesn't support voice recognition at all — try Chrome or Edge."};
  }
  if(!window.isSecureContext){
    return {ok:false, msg:"Blocked: this page isn't running on https or localhost. Opening the file directly (a file:// address) disables microphone access in Chrome. Serve it locally instead — open a terminal in the file's folder and run: python3 -m http.server 8000 — then visit http://localhost:8000 in Chrome and open the file from there. Or host it anywhere with https."};
  }
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    return {ok:false, msg:"This browser isn't exposing microphone access on this page."};
  }
  try{
    const stream = await navigator.mediaDevices.getUserMedia({audio:true});
    stream.getTracks().forEach(t=>t.stop());
    return {ok:true, msg:"Microphone access works — you're good to go."};
  }catch(err){
    return {ok:false, msg:micErrorMessage(err)};
  }
}

async function toggleMic(){
  if(!recognition) return;
  if(state.listening){
    recognition.stop();
    return;
  }
  state.error=null;
  const check = await checkMicAccess();
  if(!check.ok){
    state.error = check.msg;
    render();
    return;
  }
  state.listening=true;
  render();
  try{
    recognition.start();
  }catch(err){
    state.listening=false;
    state.error="Couldn't start the microphone (" + err.message + ").";
    render();
    return;
  }
  recognition.onresult = (e)=>{
    const transcript = e.results[0][0].transcript;
    state.listening=false;
    render();
    sendStudentMessage(transcript);
  };
  recognition.onerror = (e)=>{
    state.listening=false;
    const messages = {
      'not-allowed':"Microphone access was blocked. Check your browser/site microphone settings, or use the ⚙️ Check microphone button above for a full diagnosis.",
      'audio-capture':"No microphone was found on this device.",
      'no-speech':"Didn't catch any speech — try again, a bit closer to the mic.",
      'network':"A network error interrupted voice recognition. Try again, or use the text box.",
      'aborted':null
    };
    const msg = messages.hasOwnProperty(e.error) ? messages[e.error] : ("Voice input error: " + e.error + ". Typing works fine too.");
    if(msg) state.error = msg;
    render();
  };
  recognition.onend = ()=>{ if(state.listening){ state.listening=false; render(); } };
}

}

function introCheckSystemPrompt(c){
  return `${whoYouAre(c)} Someone has just walked up and spoken their opening line to you. This is the very first line of a training simulation for a medical student's pre-operative interview.

Determine whether their opening line includes BOTH:
1. Some form of their own name or identification (e.g. "Hi, I'm Jordan"). A bare "hi doctor" does NOT count as a name.
2. A clear statement of their role in the patient's care (e.g. "medical student," "student doctor," "I'm working with your anesthesia team today," "I'll be helping take care of you before surgery"). A vague "I'm here to ask some questions" does NOT count as a role.

Respond with ONLY valid JSON, no markdown fences, no extra text, in exactly this shape:
{"hasName": <true|false>, "hasRole": <true|false>, "patientReply": "<a short, natural, in-character reply, 1-2 sentences, spoken words only>"}

If both hasName and hasRole are true: patientReply should be a warm, brief greeting back that shows you are ready to talk (e.g. "Oh good, nice to meet you — I've been a little nervous waiting here.").
If either is false: patientReply should be a polite, natural, in-character line where you gently ask for whichever piece is missing — the way a real person would, not a checklist. Never mention "hasName," "hasRole," JSON, or that this is a simulation — just react naturally.`;
}

async function handleIntroAttempt(text){
  const c = CASES[state.caseId];
  state.messages.push({role:'user', text});
  state.sending=true;
  state.error=null;
  render();
  try{
    const raw = await callClaude(introCheckSystemPrompt(c), [{role:'user', content:text}], 300);
    const cleaned = raw.replace(/```json|```/g,'').trim();
    const parsed = JSON.parse(cleaned);
    state.messages.push({role:'assistant', text:parsed.patientReply});
    if(parsed.hasName && parsed.hasRole){ state.introduced = true; }
    state.sending=false;
    render();
    announce(`${speakerFirst(c)} says: ${parsed.patientReply}${state.introduced ? ' The physical exam is now unlocked.' : ''}`);
    if(state.voiceOn){ speak(parsed.patientReply, speakerSex(c)); }
  }catch(err){
    state.sending=false;
    state.error = introErrorMessage(err);
    render();
  }
}

function introErrorMessage(err){
  if(err && err.code==='NO_KEY') return "The AI patient can't respond yet — you need to add an Anthropic API key first. Open ⚙️ above and paste one in.";
  if(err && err.code==='UNAUTHORIZED') return err.message;
  if(err && err.code==='NETWORK') return err.message;
  return "The AI patient didn't respond (" + (err && err.message ? err.message : 'unknown error') + "). Check your API key and connection, then try again.";
}

async function handleHistoryMessage(text){
  const c = CASES[state.caseId];
  state.messages.push({role:'user', text});
  state.sending=true;
  state.error=null;
  render();
  try{
    const apiMessages = state.messages.map(m=>({role:m.role, content:m.text}));
    const reply = await callClaude(patientSystemPrompt(c), apiMessages, 400);
    state.messages.push({role:'assistant', text:reply});
    state.sending=false;
    render();
    announce(`${speakerFirst(c)} says: ${reply}`);
    if(state.voiceOn){ speak(reply, speakerSex(c)); }
  }catch(err){
    state.sending=false;
    state.error = introErrorMessage(err);
    render();
  }
}

function voiceOptionsHtml(){
  const voices = speechSynthesis.getVoices().filter(v=>/^en/i.test(v.lang));
  const list = voices.length ? voices : speechSynthesis.getVoices();
  let opts = `<option value="">Auto (best available)</option>`;
  opts += list.map(v=>`<option value="${v.voiceURI}" ${state.browserVoiceURI===v.voiceURI?'selected':''}>${v.name} (${v.lang})</option>`).join('');
  return opts;
}
if(typeof speechSynthesis !== 'undefined'){
  speechSynthesis.onvoiceschanged = ()=>{ if(state.voiceSettingsOpen) render(); };
}

/* iPhone/iPad (and Safari on Mac) only allow speech and audio to start from a tap.
   The patient's reply arrives seconds after the tap, so on the student's first tap
   we "unlock" both speech synthesis and a reusable <audio> element. */
const audioEl = new Audio();
let audioUnlocked = false;
function silentWavUrl(){
  const sampleRate = 8000, samples = 400; // 50 ms of silence
  const buf = new ArrayBuffer(44 + samples*2), v = new DataView(buf);
  const str = (o,s)=>{ for(let i=0;i<s.length;i++) v.setUint8(o+i, s.charCodeAt(i)); };
  str(0,'RIFF'); v.setUint32(4, 36+samples*2, true); str(8,'WAVE'); str(12,'fmt ');
  v.setUint32(16,16,true); v.setUint16(20,1,true); v.setUint16(22,1,true);
  v.setUint32(24,sampleRate,true); v.setUint32(28,sampleRate*2,true); v.setUint16(32,2,true); v.setUint16(34,16,true);
  str(36,'data'); v.setUint32(40, samples*2, true);
  return URL.createObjectURL(new Blob([buf], {type:'audio/wav'}));
}
function unlockAudio(){
  if(audioUnlocked) return;
  audioUnlocked = true;
  try{
    if(typeof speechSynthesis !== 'undefined'){
      const u = new SpeechSynthesisUtterance(' ');
      u.volume = 0;
      speechSynthesis.speak(u);
    }
  }catch(e){}
  try{
    audioEl.src = silentWavUrl();
    const p = audioEl.play();
    if(p && p.catch) p.catch(()=>{});
  }catch(e){}
}
['pointerdown','touchend','keydown'].forEach(ev=>document.addEventListener(ev, unlockAudio, {capture:true, passive:true}));

function stopSpeaking(){
  try{ speechSynthesis.cancel(); }catch(e){}
  try{ audioEl.pause(); }catch(e){}
}

async function speak(text, sex){
  if(state.elevenLabsKey){
    try{
      await speakElevenLabs(text, sex);
      return;
    }catch(err){
      state.error = "AI voice failed (check your ElevenLabs key or credits, and that you're not viewing this inside Claude's in-chat preview) — used your system voice instead.";
      render();
    }
  }
  speakBrowser(text, sex);
}

function speakBrowser(text, sex){
  try{
    speechSynthesis.cancel();
    const utter = new SpeechSynthesisUtterance(text);
    const voices = speechSynthesis.getVoices();
    let chosen=null;
    if(state.browserVoiceURI){ chosen = voices.find(v=>v.voiceURI===state.browserVoiceURI); }
    if(!chosen){
      chosen = voices.find(v=> sex==='female'
        ? /female|zira|samantha|victoria|aria|jenny|natural/i.test(v.name)
        : /male|david|daniel|alex|guy|davis|natural/i.test(v.name));
    }
    if(chosen) utter.voice = chosen;
    utter.rate = 1.0;
    speechSynthesis.speak(utter);
  }catch(e){/* speech synthesis not available, ignore */}
}

async function speakElevenLabs(text, sex){
  const voiceId = sex==='female' ? '21m00Tcm4TlvDq8ikWAM' : 'pNInz6obpgDQGcFmaJgB'; // Rachel / Adam (ElevenLabs premade voices)
  const resp = await fetch(`https://api.elevenlabs.io/v1/text-to-speech/${voiceId}`, {
    method:'POST',
    headers:{
      'xi-api-key': state.elevenLabsKey,
      'Content-Type':'application/json',
      'Accept':'audio/mpeg'
    },
    body: JSON.stringify({
      text: text,
      model_id: 'eleven_turbo_v2',
      voice_settings:{ stability:0.5, similarity_boost:0.75 }
    })
  });
  if(!resp.ok) throw new Error('ElevenLabs request failed: '+resp.status);
  const blob = await resp.blob();
  const url = URL.createObjectURL(blob);
  audioEl.pause();
  audioEl.src = url;
  await audioEl.play();
}

/* ============================= ASSESSMENT & PLAN ============================= */
function goToAssessment(){
  stopSpeaking();
  if(!state.introduced){
    state.error = "Introduce yourself and state your role before finishing the interview.";
    render();
    return;
  }
  if(state.messages.filter(m=>m.role==='user').length<2){
    state.error = "Ask the patient at least one question before finishing.";
    render();
    return;
  }
  state.error=null;
  state.screen='assess';
  render();
}

function renderAssess(){
  const c = CASES[state.caseId];
  const a = state.assessment;
  const radio = (name, value, label, checked)=>`<label class="choice"><input type="radio" name="${name}" value="${value}" ${checked?'checked':''}><span>${label}</span></label>`;
  app.innerHTML = `
    <div class="masthead">
      <div><h1 tabindex="-1" data-screen-heading>Your Assessment &amp; Plan</h1><div class="tag">${c.name}, ${ageSex(c)} · ${c.procedure}</div></div>
      <div class="brand-mark" aria-hidden="true">PRE-OP ASSESSMENT<br>TRAINER</div>
    </div>
    <p class="muted" style="margin-top:-10px; line-height:1.6; font-size:14.5px;">Pull together what you found, the way you would present to your attending. You asked ${state.messages.filter(m=>m.role==='user').length} questions and performed ${state.examDone.size} exam maneuvers.</p>
    ${state.error ? `<div class="error-banner" role="alert">${state.error}</div>` : ''}
    <form class="ap-form" id="apForm" novalidate>
      <fieldset>
        <legend>1. ASA physical status</legend>
        <div class="choice-row">
          ${[1,2,3,4,5].map(n=>radio('asa', n, ASA_NAMES[n], String(a.asa)===String(n))).join('')}
        </div>
        <label class="choice" style="margin-top:8px; display:inline-flex;"><input type="checkbox" id="asaE" ${a.emergency?'checked':''}><span>Add "E" (emergency operation)</span></label>
      </fieldset>
      <fieldset>
        <legend>2. Airway impression</legend>
        <div class="choice-grid">${AIRWAY_OPTIONS.map(([k,l])=>radio('airway', k, l, a.airway===k)).join('')}</div>
      </fieldset>
      <fieldset>
        <legend>3. Key perioperative risks</legend>
        <div class="hint">Select every risk this patient actually has. Choosing risks the case doesn't support costs points.</div>
        <div class="choice-grid">
          ${RISK_OPTIONS.map(([k,l])=>`<label class="choice"><input type="checkbox" name="risk" value="${k}" ${(a.risks||[]).includes(k)?'checked':''}><span>${l}</span></label>`).join('')}
        </div>
      </fieldset>
      <fieldset>
        <legend>4. Recommendation</legend>
        <div class="choice-grid">${DISPOSITION_OPTIONS.map(([k,l])=>radio('disposition', k, l, a.disposition===k)).join('')}</div>
      </fieldset>
      <fieldset>
        <legend><label for="planText">5. Your plan and reasoning</label></legend>
        <div class="hint" id="planHint">What would you tell your attending? E.g., the red flag you found, medications to hold or continue, tests or consults needed, anesthetic and airway plan, what you'd tell the patient.</div>
        <textarea id="planText" aria-describedby="planHint">${escapeAttr(a.plan||'')}</textarea>
      </fieldset>
      <div class="ap-actions">
        <button type="button" class="back-link" id="backToInterview">← Back to the interview</button>
        <button type="submit" class="begin-btn" style="padding:13px 22px; font-size:15px;">Submit for grading</button>
      </div>
    </form>
    ${disclaimerHtml()}
  `;
  const form = document.getElementById('apForm');
  form.addEventListener('change', e=>{
    const t = e.target;
    if(t.name==='asa') a.asa = t.value;
    else if(t.name==='airway') a.airway = t.value;
    else if(t.name==='disposition') a.disposition = t.value;
    else if(t.id==='asaE') a.emergency = t.checked;
    else if(t.name==='risk') a.risks = Array.from(form.querySelectorAll('input[name=risk]:checked')).map(x=>x.value);
    persistSession();
  });
  document.getElementById('planText').addEventListener('input', e=>{ a.plan = e.target.value; persistSession(); });
  document.getElementById('backToInterview').addEventListener('click', ()=>{ state.error=null; state.screen='interview'; render(); });
  form.addEventListener('submit', e=>{
    e.preventDefault();
    const missing = [];
    if(!a.asa) missing.push('an ASA class');
    if(!a.airway) missing.push('an airway impression');
    if(!a.disposition) missing.push('a recommendation');
    if(missing.length){
      state.error = 'Please choose ' + missing.join(', ') + ' before submitting.';
      render();
      const banner = app.querySelector('.error-banner'); if(banner) banner.scrollIntoView({block:'center'});
      return;
    }
    state.error=null;
    endInterview();
  });
}

/* ============================= GRADING ============================= */
function renderGrading(){
  app.innerHTML = `<div class="loading-screen" role="status"><div class="spinner" aria-hidden="true"></div><h1 tabindex="-1" data-screen-heading style="font-size:18px; font-family:'Inter',sans-serif; font-weight:500;">Grading your performance…</h1></div>`;
}

async function endInterview(){
  stopSpeaking();
  state.screen='grading';
  render();
  const c = CASES[state.caseId];
  const ev = evaluateEncounter(c);
  const transcriptText = state.messages.map(m=> (m.role==='user'?'Student: ':(c.speaker?'Parent: ':'Patient: ')) + m.text).join('\n');
  let ai = null, aiError = null;
  try{
    const raw = await callClaude(
      gradingSystemPrompt(c, ev),
      [{role:'user', content:'Here is the full transcript of the encounter:\n\n'+transcriptText}],
      1200
    );
    const cleaned = raw.replace(/```json|```/g,'').trim();
    ai = JSON.parse(cleaned);
  }catch(err){
    aiError = (err && err.message) ? err.message : 'unknown error';
  }
  state.report = {ev, ai, aiError, finishedAt:Date.now()};
  state.screen='report';
  render();
}

/* ============================= REPORT ============================= */
function renderReport(){
  const c = CASES[state.caseId];
  const r = state.report;
  const ev = r.ev, ai = r.ai || {};
  const verdict = ev.overall>=85 ? "Strong, thorough encounter." : ev.overall>=65 ? "Solid start — a few gaps to tighten up." : "Good practice rep — several important items were missed.";
  const list = (items, empty)=> (items && items.length) ? items.map(x=>`<li>${escapeHtml(String(x))}</li>`).join('') : `<li>${empty}</li>`;
  const check = (items)=> items.map(i=>`<li class="${i.hit?'hit':'miss'}"><span class="mark" aria-hidden="true">${i.hit?'✓':'✗'}</span><span><span class="sr-only">${i.hit?'Done: ':'Missed: '}</span>${escapeHtml(i.label)}${i.critical?'<span class="crit-tag">KEY</span>':''}</span></li>`).join('');
  const p = ev.plan;
  const riskNames = arr => arr.length ? arr.map(k=>escapeHtml(optionLabel(RISK_OPTIONS,k))).join('<br>') : '—';
  app.innerHTML = `
    <div class="masthead">
      <div><h1 tabindex="-1" data-screen-heading>Encounter Report</h1><div class="tag">${c.name} · ${c.procedure}</div><div class="tag">${new Date(r.finishedAt||Date.now()).toLocaleString()}</div></div>
      <div class="brand-mark" aria-hidden="true">PRE-OP ASSESSMENT<br>TRAINER</div>
    </div>
    <div class="score-hero">
      <div>
        <div class="label">Overall Score</div>
        <div class="num">${ev.overall}<span>/100</span></div>
      </div>
      <div class="verdict">${verdict}</div>
    </div>
    ${r.aiError ? `<div class="intro-banner">Written AI feedback wasn't available (${escapeHtml(r.aiError)}). Your scores and checklists below were calculated automatically and are complete.</div>` : ''}
    <div class="domains">
      ${Object.entries(ev.domains).map(([key,d])=>`
        <div class="domain-card">
          <div class="dname">${domainName(key)}</div>
          <div class="dscore">${d.score}<span style="font-size:14px;color:var(--ink-soft);">/${d.max}</span></div>
          <div class="bar-track" aria-hidden="true"><div class="bar-fill" style="width:${Math.min(100,(d.score/d.max)*100)}%"></div></div>
          <div style="margin-top:8px;font-size:13px;color:var(--ink-soft);line-height:1.5;">${escapeHtml(d.auto)}${ai[key] ? ' '+escapeHtml(String(ai[key])) : ''}</div>
        </div>
      `).join('')}
    </div>
    <div class="report-section critical">
      <h2 class="h4">The red flag in this case</h2>
      <p style="margin:0; line-height:1.6; font-size:14.5px;">${escapeHtml(c.redFlag)}</p>
    </div>
    <div class="report-section">
      <h2 class="h4">History checklist</h2>
      <p class="note-small">Matched automatically from the words in your questions, so unusual phrasing can be missed. Items marked KEY relate to this case's red flag.</p>
      <ul class="checklist">${check(ev.history)}</ul>
    </div>
    <div class="report-section">
      <h2 class="h4">Physical exam — key maneuvers</h2>
      <ul class="checklist">${check(ev.exam)}</ul>
    </div>
    <div class="report-section">
      <h2 class="h4">Your assessment vs. expected</h2>
      <table class="compare-table">
        <thead><tr><th scope="col"></th><th scope="col">You</th><th scope="col">Expected</th></tr></thead>
        <tbody>
          <tr><th scope="row">ASA class</th><td>${p.asaOk?'✓':'✗'} ${ASA_NAMES[p.asaChosen]||'—'}${p.emergency?'E':''}</td><td>${escapeHtml(c.asaClass)}</td></tr>
          <tr><th scope="row">Airway</th><td>${p.airwayOk?'✓':'✗'} ${escapeHtml(optionLabel(AIRWAY_OPTIONS,p.airwayChosen))}</td><td>${c.answer.airway.map(k=>escapeHtml(optionLabel(AIRWAY_OPTIONS,k))).join(' or ')}</td></tr>
          <tr><th scope="row">Recommendation</th><td>${p.dispOk?'✓':'✗'} ${escapeHtml(optionLabel(DISPOSITION_OPTIONS,p.dispChosen))}</td><td>${c.answer.disposition.map(k=>escapeHtml(optionLabel(DISPOSITION_OPTIONS,k))).join(' or ')}</td></tr>
          <tr><th scope="row">Risks found</th><td colspan="2">${riskNames(p.riskHits)}</td></tr>
          <tr><th scope="row">Risks missed</th><td colspan="2">${riskNames(p.riskMissed)}</td></tr>
          ${p.riskExtra.length ? `<tr><th scope="row">Not supported by this case</th><td colspan="2">${riskNames(p.riskExtra)}</td></tr>` : ''}
        </tbody>
      </table>
      <p style="margin:12px 0 0; line-height:1.6; font-size:14.5px;"><strong>Expected reasoning:</strong> ${escapeHtml(c.answer.why)}</p>
      ${p.planText ? `<p style="margin:12px 0 0; line-height:1.6; font-size:14.5px;"><strong>Your written plan:</strong> ${escapeHtml(p.planText)}</p>` : ''}
      ${ai.planFeedback ? `<p style="margin:12px 0 0; line-height:1.6; font-size:14.5px;"><strong>Feedback on your plan:</strong> ${escapeHtml(String(ai.planFeedback))}</p>` : ''}
    </div>
    ${r.ai ? `
    <div class="report-section critical">
      <h2 class="h4">Missed or incomplete</h2>
      <ul>${list(ai.missedCritical, 'Nothing significant — nice work.')}</ul>
    </div>
    <div class="report-section strength">
      <h2 class="h4">What you did well</h2>
      <ul>${list(ai.strengths, '—')}</ul>
    </div>` : ''}
    <div class="report-section">
      <h2 class="h4">Communication</h2>
      <ul class="checklist">${check(ev.comm)}</ul>
    </div>
    <div class="report-section teach">
      <h2 class="h4">Teaching points for this case</h2>
      <ul>${list(c.teachingPoints, '—')}</ul>
    </div>
    ${refsHtml(c.refs)}
    <div class="report-actions">
      <button class="again-btn" id="againBtn">Try another patient</button>
      <button class="secondary" id="printBtn">Print or save as PDF</button>
      <button class="secondary" id="downloadBtn">Download report (.txt)</button>
    </div>
    ${disclaimerHtml()}
  `;
  document.getElementById('againBtn').addEventListener('click', ()=>{
    state.screen='select'; state.caseId=null; state.report=null; state.messages=[]; render();
  });
  document.getElementById('printBtn').addEventListener('click', ()=>window.print());
  document.getElementById('downloadBtn').addEventListener('click', downloadReport);
}

function reportText(){
  const c = CASES[state.caseId];
  const r = state.report, ev = r.ev, ai = r.ai || {}, p = ev.plan;
  const L = [];
  L.push('PRE-OP ASSESSMENT TRAINER — ENCOUNTER REPORT');
  L.push(`Patient: ${c.name}, ${ageSex(c)} — ${c.procedure}`);
  L.push(`Completed: ${new Date(r.finishedAt||Date.now()).toLocaleString()}`);
  L.push('', `OVERALL SCORE: ${ev.overall}/100`);
  Object.entries(ev.domains).forEach(([k,d])=>L.push(`  ${domainName(k)}: ${d.score}/${d.max} — ${d.auto}${ai[k]?' '+ai[k]:''}`));
  L.push('', 'HISTORY CHECKLIST');
  ev.history.forEach(h=>L.push(`  [${h.hit?'x':' '}] ${h.label}${h.critical?' (KEY)':''}`));
  L.push('', 'EXAM MANEUVERS');
  ev.exam.forEach(h=>L.push(`  [${h.hit?'x':' '}] ${h.label}`));
  L.push('', 'ASSESSMENT & PLAN');
  L.push(`  ASA: ${ASA_NAMES[p.asaChosen]||'—'}${p.emergency?'E':''} (expected: ${c.asaClass})`);
  L.push(`  Airway: ${optionLabel(AIRWAY_OPTIONS,p.airwayChosen)}`);
  L.push(`  Recommendation: ${optionLabel(DISPOSITION_OPTIONS,p.dispChosen)}`);
  L.push(`  Risks found: ${p.riskHits.map(k=>optionLabel(RISK_OPTIONS,k)).join('; ')||'—'}`);
  L.push(`  Risks missed: ${p.riskMissed.map(k=>optionLabel(RISK_OPTIONS,k)).join('; ')||'—'}`);
  if(p.riskExtra.length) L.push(`  Not supported by this case: ${p.riskExtra.map(k=>optionLabel(RISK_OPTIONS,k)).join('; ')}`);
  L.push(`  Written plan: ${p.planText||'—'}`);
  if(ai.planFeedback) L.push(`  Feedback: ${ai.planFeedback}`);
  L.push(`  Expected reasoning: ${c.answer.why}`);
  if(r.ai){
    L.push('', 'MISSED OR INCOMPLETE'); (ai.missedCritical||[]).forEach(x=>L.push('  - '+x));
    L.push('', 'STRENGTHS'); (ai.strengths||[]).forEach(x=>L.push('  - '+x));
  }
  L.push('', 'COMMUNICATION');
  ev.comm.forEach(h=>L.push(`  [${h.hit?'x':' '}] ${h.label}`));
  L.push('', 'RED FLAG', '  '+c.redFlag);
  L.push('', 'TEACHING POINTS'); c.teachingPoints.forEach(x=>L.push('  - '+x));
  if(c.refs && c.refs.length){ L.push('', 'SOURCES'); c.refs.forEach((k,i)=>L.push(`  ${i+1}. ${REFS[k]}`)); }
  L.push('', 'TRANSCRIPT');
  state.messages.forEach(m=>L.push(`${m.role==='user'?'Student':speakerFirst(c)}: ${m.text}`));
  L.push('', 'Educational simulation with fictional patients. Not medical advice.');
  return L.join('\n');
}

function downloadReport(){
  const c = CASES[state.caseId];
  const blob = new Blob([reportText()], {type:'text/plain;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `preop-report-${c.id}-${new Date().toISOString().slice(0,10)}.txt`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 2000);
}

function refsHtml(keys){
  if(!keys || !keys.length) return '';
  return `<div class="report-section refs">
      <h2 class="h4">Sources &amp; further reading</h2>
      <ol>${keys.map(k=>`<li>${escapeHtml(REFS[k])}</li>`).join('')}</ol>
      <p class="note-small" style="margin:8px 0 0;">Guidelines are updated periodically — check for the latest version and follow your institution's policies.</p>
    </div>`;
}

function domainName(key){
  return {history:'History Taking', physicalExam:'Physical Exam', clinicalReasoning:'Clinical Reasoning', communication:'Communication'}[key] || key;
}

render();
